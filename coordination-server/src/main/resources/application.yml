server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

coordination:
  etcd:
    endpoints:
      - "http://127.0.0.1:2379"
    rootPrefix: "/coord/v1/tenants"
    dialTimeout: 3s
    requestTimeout: 3s
    # Prod: set via env/secret (COORDINATION_ETCD_USERNAME / _PASSWORD). Empty = no RBAC.
    username: ""
    password: ""
    # Prod TLS / mTLS — mount PEMs and point paths here; use https:// endpoints.
    tls:
      enabled: false
      ca-cert-path: ""   # e.g. /var/run/secrets/etcd/ca.crt
      cert-path: ""      # client cert (mTLS)
      key-path: ""       # client key (PEM, unencrypted)
      authority: ""      # optional SNI / gRPC authority override
  apiKey: ""
  idempotency:
    enabled: true
    ttl-seconds: 86400
    max-header-length: 128
    max-body-bytes: 262144
  # Fallback when coordination.rss.required=false (written to etcd on startup).
  active-region:
    value: r1
    status: ACTIVE
    poll-interval-ms: 5000
  # Region State Service (master data: activeRegion + status via SSE).
  # required=true → must fetch from RSS on startup (fail-fast) and keep syncing.
  # required=false → use active-region.value/status from this file.
  rss:
    required: false
    base-url: ""
    recovery-group: ""
    # Local region of THIS JVM — sent TO RSS as ?region= (not returned as master data).
    # RSS replies with activeRegion (who serves the RG) + status from this region's POV.
    home-region: r1
    connect-timeout: 30s
  sre:
    stream-listen-token: "sre-stream-dev-token"
  limits:
    max-keys-per-tenant: 10000

grpc:
  server:
    port: 9090

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
