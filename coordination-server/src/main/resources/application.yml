server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

coordination:
  etcd:
    endpoints:
      - "http://127.0.0.1:2379"
    rootPrefix: "/coord/v1/tenants"
    dialTimeout: 3s
    requestTimeout: 3s
    # Prod: set via env/secret (COORDINATION_ETCD_USERNAME / _PASSWORD). Empty = no RBAC.
    username: ""
    password: ""
    # Prod TLS / mTLS — mount PEMs and point paths here; use https:// endpoints.
    tls:
      enabled: false
      ca-cert-path: ""   # e.g. /var/run/secrets/etcd/ca.crt
      cert-path: ""      # client cert (mTLS)
      key-path: ""       # client key (PEM, unencrypted)
      authority: ""      # optional SNI / gRPC authority override
  apiKey: ""
  # Etcd segment for regional short-path APIs (env COORDINATION_REGION). Clients choose regional vs global.
  region: r1
  idempotency:
    enabled: true
    ttl-seconds: 86400
    max-header-length: 128
    max-body-bytes: 262144
  sre:
    stream-listen-token: "sre-stream-dev-token"
  limits:
    max-keys-per-tenant: 10000

grpc:
  server:
    port: 9090

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
