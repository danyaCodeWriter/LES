openapi: 3.0.3
info:
  title: Region State Service API
  description: |
    rss-api streams the active-region state of a Recovery Group to application
    SDKs as Server-Sent Events (SSE): an initial snapshot, then live state
    updates, interleaved with heartbeats. State is sourced by watching the
    RegionState object of the Recovery Group in the RCP apiserver.

    Contract: t-ready-arch/docs/rcp/rss_sdk_interface.md and rfc-03.

    ## SSE framing (not fully expressible in OpenAPI)

    The 200 response is a `text/event-stream`. Each event is a block of lines
    terminated by a blank line:

        event: 
        id: 
        data: 

    - `id` is the state revision (the RegionState resourceVersion), monotonically
      non-decreasing; it is what the client echoes back on reconnect.
    - `state` events carry a StateEvent payload; `heartbeat` events carry a
      HeartbeatEvent payload. Clients must ignore unknown event types.

    ## Reconnect / resume

    On reconnect the client sends its last revision as `from_revision` (query,
    wins) or the standard `Last-Event-ID` header. The server decides:
      - no/invalid/too-new revision           -> full snapshot `state` event, then watch
      - revision <= current revision           -> immediate `heartbeat` (resume accepted), then watch replays missed states
    A compacted (too-old) revision is accepted the same way, but the watch then
    fails with 410 and the server recovers by emitting a fresh snapshot `state`
    event. The client never sends epoch; resume validity is entirely the server's
    responsibility (fail-safe: when in doubt, full snapshot).
  version: "1.0.0"
paths:
  /v1/recovery-groups/{recoveryGroup}/active-region:
    get:
      summary: Stream the active-region state of a Recovery Group as SSE.
      operationId: streamActiveRegion
      parameters:
        - name: recoveryGroup
          in: path
          required: true
          description: Logical Recovery Group name; matches the RegionState object name.
          schema:
            type: string
            minLength: 1
        - name: region
          in: query
          required: true
          description: The application instance's home region; the stream is rendered from its point of view.
          schema:
            type: string
            minLength: 1
        - name: from_revision
          in: query
          required: false
          description: |
            Resume point: the last confirmed revision. Takes precedence over the
            Last-Event-ID header when both are present.
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: Last-Event-ID
          in: header
          required: false
          description: Standard SSE resume point; used when from_revision is absent.
          schema:
            type: string
      responses:
        '200':
          description: SSE stream opened. See the description for the frame format.
          headers:
            Content-Type:
              schema:
                type: string
                example: text/event-stream; charset=utf-8
          content:
            text/event-stream:
              schema:
                description: |
                  Concatenated SSE frames. Payloads are one of the referenced
                  schemas depending on the event type.
                oneOf:
                  - $ref: '#/components/schemas/StateEvent'
                  - $ref: '#/components/schemas/HeartbeatEvent'
        '400':
          description: Unknown region, unknown Recovery Group, or malformed resume point. Do not retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: |
            RSS cannot confirm current state (e.g. etcd quorum loss). Retryable;
            a sustained 503 drives the SDK to stale-state via its connect timeout.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal error. Retryable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: Bad gateway. Retryable.
        '504':
          description: Gateway timeout. Retryable.
components:
  schemas:
    StateEvent:
      type: object
      description: Payload of a `state` SSE event.
      required:
        - region
        - activeRegion
        - status
        - regionalWritesBlocked
        - epoch
        - revision
      properties:
        region:
          type: string
          description: The application instance's local region (echoes the query param).
        activeRegion:
          type: string
          description: The region currently serving the Recovery Group.
        status:
          $ref: '#/components/schemas/RegionStatus'
        regionalWritesBlocked:
          type: boolean
          description: Whether writes in the local region are blocked (during the drain and switch-platforms phases).
        epoch:
          type: integer
          format: int64
          description: Generation of RG authority (rfc-03); bumped on each switchover.
        revision:
          type: integer
          format: int64
          description: State revision; duplicates the SSE id.
    HeartbeatEvent:
      type: object
      description: Payload of a `heartbeat` SSE event; confirms source freshness.
      required:
        - epoch
        - revision
      properties:
        epoch:
          type: integer
          format: int64
          description: Generation of RG authority.
        revision:
          type: integer
          format: int64
          description: Revision of the last confirmed state; duplicates the SSE id.
    RegionStatus:
      type: string
      description: |
        Status of the region the application instance runs in.
        `switch` is an informational marker of an in-progress switch operation;
        applications must not build logic on it (decide on status active/stand_in,
        regionalWritesBlocked, and the SDK-computed stale flag).
      enum:
        - active
        - stand_in
        - switch
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
