openapi: 3.0.3
info:
  title: Coordination service API
  version: "1.0.0"
  description: |
    REST + SSE поверх etcd. Публичный контракт — **две** семьи: **active-region** (короткие пути без
    `regionId` в URL) и **global** (`/v1/tenants/{tenant}/global/...`). Текущий logical active region
    сервер подставляет сам (`GET /active-region`).

    Динамическая спецификация: springdoc `/v3/api-docs`, UI `/swagger-ui.html`.
    gRPC: `proto/coordination/v1/coordination.proto` (active-region RPC без `region_id` в запросе).

    **Роль инстанса:** `coordination.deployment.role` / `COORDINATION_DEPLOYMENT_ROLE` (и опционально
    `coordination.deployment.role-file`): роль **поллится** с тем же интервалом, что `coordination.active-region`
    (`poll-interval-ms`). При смене роли (`ACTIVE`, `STANDBY`, `SWITCH`) инстанс сразу начинает принимать или отклонять
    active-region мутации; на `STANDBY` и `SWITCH` они дают **403**, global — всегда; см. README. Роль `SWITCH` дополнительно
    включает ускоренную очистку lease-ключей старого сегмента при `REGION_DRAIN` (оператор обязан остановить старые процессы).
    У обычного процесса ОС переменные окружения после старта JVM часто **не** меняются — для горячей смены без нового pod используйте
    **файл** (`role-file`), как для active region.

    **Чтение coordinator / workers / jobs** (GET и SSE `stream/workers|jobs|keys`, не `active-region`): нужен тот же секрет,
    что для renew лидера в этом контуре — `Authorization: Bearer <token>` или `X-Coordinator-Token` (active region
    vs global соответственно). Дополнительно **только для SSE** `stream/workers` и `stream/jobs` (regional и global)
    можно задать статический токен `coordination.sre.stream-listen-token` (SRE / мониторинг без coordinator acquire).
    **`GET .../stream/keys`** — watch по всем coordination-ключам tenant (`regions/` + `global/`, без `idempotency/`);
    авторизация: **global** coordinator read token или тот же SRE stream token (не regional leader).
    В JSON ответах поля renew-token у coordinator/worker/job опущены (null).

    **Идемпотентность HTTP:** при включённой настройке `coordination.idempotency` сервер принимает опциональный заголовок
    `Idempotency-Key` или `X-Idempotency-Key` на allowlisted мутациях (`coordinator/acquire`, `workers/register`,
    `jobs/...:acquire`, `PUT .../global/kv/{keyId}`). Отпечаток включает метод, путь, ключ, сырое тело запроса и (для
    PUT KV) токен доступа из заголовка, чтобы различить create и replace. Повтор с тем же ключом и тем же телом в пределах
    TTL возвращает сохранённый ответ (**200**, **201**, **409**). Смена тела при том же ключе даёт новый отпечаток.
servers:
  - url: http://localhost:8080
    description: Локальный сервер

tags:
  - name: ActiveRegion
    description: Короткие пути — coordinator, workers, jobs, stream (active region подставляет сервер).
  - name: Global
    description: Cross-DC `/global/...` — coordinator, workers, jobs, stream.
  - name: Rings
    description: Consistent hash без etcd.
  - name: ActiveRegionMeta
    description: `GET /active-region` — какой logical active region сейчас.
  - name: KvTickets
    description: |
      Простые ключи в etcd под `.../tenants/{tenant}/global/kv/{keyId}` с опциональным TTL и произвольным JSON-значением;
      секрет `accessToken` выдаётся один раз при создании.

paths:
  /v1/tenants/{tenantId}/coordinator/acquire:
    post:
      tags: [ActiveRegion]
      summary: Захватить coordinator в active region
      operationId: acquireCoordinatorActive
      parameters:
        - $ref: "#/components/parameters/tenantId"
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoordinatorAcquireRequest"
      responses:
        "200":
          description: Результат попытки захвата
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcquireCoordinatorResult"
        "409":
          description: Лидер уже есть (COORDINATOR_EXISTS)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceConflict"

  /v1/tenants/{tenantId}/coordinator:
    get:
      tags: [ActiveRegion]
      summary: Текущий coordinator в active region
      operationId: getCoordinatorActive
      security:
        - CoordinatorReadBearer: []
      parameters:
        - $ref: "#/components/parameters/tenantId"
      responses:
        "200":
          description: Состояние лидера или пустое тело если нет лидера
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoordinatorState"

  /v1/tenants/{tenantId}/coordinator/active:
    get:
      tags: [ActiveRegion]
      summary: Алиас get coordinator (active region)
      operationId: getCoordinatorActiveAlias
      security:
        - CoordinatorReadBearer: []
      parameters:
        - $ref: "#/components/parameters/tenantId"
      responses:
        "200":
          description: Как у GET /coordinator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoordinatorState"

  /v1/tenants/{tenantId}/coordinator/renew:
    post:
      tags: [ActiveRegion]
      summary: Продлить lease coordinator (active region), если token совпадает с выданным при acquire
      operationId: renewCoordinatorActive
      parameters:
        - $ref: "#/components/parameters/tenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoordinatorRenewRequest"
      responses:
        "200":
          description: renewed true/false
          content:
            application/json:
              schema:
                type: object
                properties:
                  renewed:
                    type: boolean

  /v1/tenants/{tenantId}/global/coordinator/acquire:
    post:
      tags: [Global]
      summary: Захватить единственного cross-DC coordinator (etcd .../global/leader)
      operationId: acquireCoordinatorGlobal
      parameters:
        - $ref: "#/components/parameters/tenantId"
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoordinatorAcquireRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcquireCoordinatorResult"
        "409":
          description: Лидер уже есть (COORDINATOR_EXISTS)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceConflict"

  /v1/tenants/{tenantId}/global/coordinator:
    get:
      tags: [Global]
      summary: Текущий global coordinator
      operationId: getCoordinatorGlobal
      security:
        - CoordinatorReadBearer: []
      parameters:
        - $ref: "#/components/parameters/tenantId"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoordinatorState"

  /v1/tenants/{tenantId}/global/coordinator/renew:
    post:
      tags: [Global]
      summary: Renew global coordinator (token из acquire)
      operationId: renewCoordinatorGlobal
      parameters:
        - $ref: "#/components/parameters/tenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoordinatorRenewRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  renewed:
                    type: boolean

  /v1/tenants/{tenantId}/global/workers/register:
    post:
      tags: [Global]
      summary: Регистрация worker в общем пуле (все DC)
      operationId: registerWorkerGlobal
      parameters:
        - $ref: "#/components/parameters/tenantId"
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkerRegisterRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerRegisterResult"
        "409":
          description: workerId уже занят (WORKER_EXISTS)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceConflict"

  /v1/tenants/{tenantId}/global/workers/{workerId}/heartbeat:
    post:
      tags: [Global]
      operationId: workerHeartbeatGlobal
      parameters:
        - $ref: "#/components/parameters/tenantId"
        - $ref: "#/components/parameters/workerId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkerHeartbeatRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean

  /v1/tenants/{tenantId}/global/workers/{workerId}/deregister:
    post:
      tags: [Global]
      operationId: workerDeregisterGlobal
      parameters:
        - $ref: "#/components/parameters/tenantId"
        - $ref: "#/components/parameters/workerId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkerHeartbeatRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: boolean

  /v1/tenants/{tenantId}/global/workers:
    get:
      tags: [Global]
      summary: Список workers в global пуле
      operationId: listWorkersGlobal
      security:
        - CoordinatorReadBearer: []
      parameters:
        - $ref: "#/components/parameters/tenantId"
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkerState"

  /v1/tenants/{tenantId}/global/workers/ids:
    get:
      tags: [Global]
      summary: Список workerId в global пуле (для rings/assign)
      operationId: listGlobalWorkerIds
      security:
        - CoordinatorReadBearer: []
      parameters:
        - $ref: "#/components/parameters/tenantId"
      responses:
        "200":
          description: JSON-массив строк, отсортированный по возрастанию
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string

  /v1/tenants/{tenantId}/global/workers/{workerId}/jobs:
    get:
      tags: [Global]
      summary: Global job-lock'и, где holder = этот worker
      description: Bearer / `X-Worker-Token` — токен из `POST .../global/workers/register`.
      operationId: listJobsForWorkerGlobal
      parameters:
        - $ref: "#/components/parameters/tenantId"
        - $ref: "#/components/parameters/workerId"
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JobState"

  /v1/tenants/{tenantId}/global/kv/{keyId}:
    put:
      tags: [KvTickets]
      summary: Создать или обновить KV-ticket (global namespace tenant)
      description: |
        Создание: без `Authorization` — тело `{"value":<любой JSON>,"ttlSeconds":10}` или без `ttlSeconds` (ключ без lease).
        Обновление: `Authorization: Bearer <accessToken из ответа create>` или `X-Kv-Access-Token`.
        TTL при обновлении можно сменить (новый lease); без `ttlSeconds` в теле — сохраняется прежний lease (или без lease).
      operationId: putGlobalKvTicket
      parameters:
        - $ref: "#/components/parameters/tenantId"
        - $ref: "#/components/parameters/idempotencyKey"
        - name: keyId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KvPutRequest"
      responses:
        "200":
          description: Обновление успешно
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KvPutResponse"
        "201":
          description: Ключ создан; в теле `accessToken` — сохраните для GET/DELETE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KvPutResponse"
        "409":
          description: Ключ уже есть (KV_EXISTS) или конфликт ревизии (KV_REVISION_CONFLICT)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceConflict"
    get:
      tags: [KvTickets]
      summary: Прочитать значение ticket
      description: Требуется Bearer или `X-Kv-Access-Token` = `accessToken` с создания.
      operationId: getGlobalKvTicket
      parameters:
        - $ref: "#/components/parameters/tenantId"
        - name: keyId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KvGetResponse"
        "401":
          description: Нет access token
        "404":
          description: KV_NOT_FOUND
    delete:
      tags: [KvTickets]
      summary: Удалить ticket
      operationId: deleteGlobalKvTicket
      parameters:
        - $ref: "#/components/parameters/tenantId"
        - name: keyId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: boolean

  /v1/tenants/{tenantId}/global/jobs/{jobId}:acquire:
    post:
      tags: [Global]
      summary: Захват job-lock в global scope
      operationId: acquireJobGlobal
      parameters:
        - $ref: "#/components/parameters/tenantId"
        - $ref: "#/components/parameters/jobId"
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobAcquireRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcquireJobResult"
        "409":
          description: Lock по jobId уже существует (JOB_EXISTS)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceConflict"

  /v1/tenants/{tenantId}/global/jobs/{jobId}:release:
    post:
      tags: [Global]
      operationId: releaseJobGlobal
      parameters:
        - $ref: "#/components/parameters/tenantId"
        - $ref: "#/components/parameters/jobId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobTokenRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  released:
                    type: boolean

  /v1/tenants/{tenantId}/global/jobs/{jobId}:renew:
    post:
      tags: [Global]
      summary: Продлить etcd lease job-lock (тот же token, что при acquire)
      operationId: renewJobGlobal
      parameters:
        - $ref: "#/components/parameters/tenantId"
        - $ref: "#/components/parameters/jobId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobTokenRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  renewed:
                    type: boolean

  /v1/tenants/{tenantId}/global/jobs/{jobId}:
    get:
      tags: [Global]
      operationId: getJobGlobal
      summary: Состояние одного global job-lock
      description: |
        Доступ: токен **лидера global coordinator** (как у остальных GET в global scope) **или** токен регистрации
        воркера, который является **holder** этого job (Bearer или `X-Worker-Token`).
      security:
        - CoordinatorReadBearer: []
        - JobHolderWorkerRead: []
      parameters:
        - $ref: "#/components/parameters/tenantId"
        - $ref: "#/components/parameters/jobId"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobState"

  /v1/tenants/{tenantId}/global/stream/workers:
    get:
      tags: [Global]
      summary: SSE — изменения global workers
      operationId: streamWorkersGlobal
      security:
        - CoordinatorReadBearer: []
      parameters:
        - $ref: "#/components/parameters/tenantId"
      responses:
        "200":
          content:
            text/event-stream:
              schema:
                type: string

  /v1/tenants/{tenantId}/global/stream/jobs:
    get:
      tags: [Global]
      summary: SSE — изменения global jobs
      operationId: streamJobsGlobal
      security:
        - CoordinatorReadBearer: []
      parameters:
        - $ref: "#/components/parameters/tenantId"
      responses:
        "200":
          content:
            text/event-stream:
              schema:
                type: string

  /v1/tenants/{tenantId}/workers/register:
    post:
      tags: [ActiveRegion]
      summary: Регистрация worker (active region)
      operationId: registerWorkerActive
      parameters:
        - $ref: "#/components/parameters/tenantId"
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkerRegisterRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerRegisterResult"
        "409":
          description: workerId уже занят (WORKER_EXISTS)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceConflict"

  /v1/tenants/{tenantId}/workers/{workerId}/heartbeat:
    post:
      tags: [ActiveRegion]
      summary: Heartbeat worker (active region)
      operationId: workerHeartbeatActive
      parameters:
        - $ref: "#/components/parameters/tenantId"
        - $ref: "#/components/parameters/workerId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkerHeartbeatRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean

  /v1/tenants/{tenantId}/workers/{workerId}/deregister:
    post:
      tags: [ActiveRegion]
      summary: Deregister worker (active region)
      operationId: workerDeregisterActive
      parameters:
        - $ref: "#/components/parameters/tenantId"
        - $ref: "#/components/parameters/workerId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkerHeartbeatRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: boolean

  /v1/tenants/{tenantId}/workers/{workerId}/jobs:
    get:
      tags: [ActiveRegion]
      summary: Job-lock'и, где holder = этот worker (токен регистрации worker)
      description: |
        Авторизация: `Authorization: Bearer <token из POST .../workers/register>` или заголовок `X-Worker-Token`
        с тем же значением. Координаторский Bearer не нужен.
      operationId: listJobsForWorkerActive
      parameters:
        - $ref: "#/components/parameters/tenantId"
        - $ref: "#/components/parameters/workerId"
      responses:
        "200":
          description: Список job (секрет lock-token в ответе опущен)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JobState"
        "401":
          description: Нет worker-токена
        "403":
          description: Неверный worker-токен

  /v1/tenants/{tenantId}/workers/ids:
    get:
      tags: [ActiveRegion]
      summary: Список workerId в active-region пуле (для rings/assign)
      operationId: listActiveRegionWorkerIds
      security:
        - CoordinatorReadBearer: []
      parameters:
        - $ref: "#/components/parameters/tenantId"
      responses:
        "200":
          description: JSON-массив строк, отсортированный по возрастанию
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string

  /v1/tenants/{tenantId}/workers:
    get:
      tags: [ActiveRegion]
      summary: Список workers (active region)
      operationId: listWorkersActive
      security:
        - CoordinatorReadBearer: []
      parameters:
        - $ref: "#/components/parameters/tenantId"
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkerState"

  /v1/tenants/{tenantId}/jobs/{jobId}:acquire:
    post:
      tags: [ActiveRegion]
      summary: Захват job-lock (active region)
      operationId: acquireJobActive
      parameters:
        - $ref: "#/components/parameters/tenantId"
        - $ref: "#/components/parameters/jobId"
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobAcquireRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcquireJobResult"
        "409":
          description: Lock по jobId уже существует (JOB_EXISTS)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceConflict"

  /v1/tenants/{tenantId}/jobs/{jobId}:release:
    post:
      tags: [ActiveRegion]
      operationId: releaseJobActive
      parameters:
        - $ref: "#/components/parameters/tenantId"
        - $ref: "#/components/parameters/jobId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobTokenRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  released:
                    type: boolean

  /v1/tenants/{tenantId}/jobs/{jobId}:renew:
    post:
      tags: [ActiveRegion]
      summary: Продлить etcd lease job-lock (тот же token, что при acquire)
      operationId: renewJobActive
      parameters:
        - $ref: "#/components/parameters/tenantId"
        - $ref: "#/components/parameters/jobId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobTokenRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  renewed:
                    type: boolean

  /v1/tenants/{tenantId}/jobs/{jobId}:
    get:
      tags: [ActiveRegion]
      operationId: getJobActive
      summary: Состояние одного regional job-lock
      description: |
        Доступ: токен **лидера regional coordinator** (active region) **или** токен регистрации воркера, который
        является **holder** этого job (Bearer или `X-Worker-Token`).
      security:
        - CoordinatorReadBearer: []
        - JobHolderWorkerRead: []
      parameters:
        - $ref: "#/components/parameters/tenantId"
        - $ref: "#/components/parameters/jobId"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobState"

  /v1/rings/assign:
    post:
      tags: [Rings]
      summary: Consistent hash ranges (без записи в etcd)
      operationId: computeRanges
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComputeRangesRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RingAssignResponse"

  /v1/tenants/{tenantId}/active-region:
    get:
      tags: [ActiveRegionMeta]
      summary: Текущий resolved active region
      operationId: getActiveRegion
      parameters:
        - $ref: "#/components/parameters/tenantId"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActiveRegionInfo"

  /v1/tenants/{tenantId}/stream/workers:
    get:
      tags: [ActiveRegion]
      summary: SSE — изменения workers (active region)
      operationId: streamWorkersActive
      security:
        - CoordinatorReadBearer: []
      parameters:
        - $ref: "#/components/parameters/tenantId"
      responses:
        "200":
          description: |
            `text/event-stream`. События — сериализованные JSON объектов WatchEventDto
            (type, key, modRevision, leaseId, valueJson).
          content:
            text/event-stream:
              schema:
                type: string

  /v1/tenants/{tenantId}/stream/jobs:
    get:
      tags: [ActiveRegion]
      summary: SSE — изменения jobs (active region)
      operationId: streamJobsActive
      security:
        - CoordinatorReadBearer: []
      parameters:
        - $ref: "#/components/parameters/tenantId"
      responses:
        "200":
          content:
            text/event-stream:
              schema:
                type: string

  /v1/tenants/{tenantId}/stream/keys:
    get:
      tags: [ActiveRegion]
      summary: SSE — все coordination-ключи tenant (regions + global)
      operationId: streamTenantKeysActive
      security:
        - CoordinatorReadBearer: []
      parameters:
        - $ref: "#/components/parameters/tenantId"
      responses:
        "200":
          description: |
            `text/event-stream`. Два etcd watch (префиксы `.../regions/` и `.../global/`). События — как у `stream/workers`.
            Авторизация: **global** coordinator read token или SRE `coordination.sre.stream-listen-token` (не regional leader).
          content:
            text/event-stream:
              schema:
                type: string

  /v1/tenants/{tenantId}/stream/active-region:
    get:
      tags: [ActiveRegion]
      summary: SSE — смена active region
      operationId: streamActiveRegion
      parameters:
        - $ref: "#/components/parameters/tenantId"
      responses:
        "200":
          description: |
            `text/event-stream` (Server-Sent Events). Поле `data` — JSON как у `GET .../active-region` (без `tenantId`): `region`, `status`, `activeRegion`, `source`, drain-поля.
          content:
            text/event-stream:
              schema:
                type: string

components:
  securitySchemes:
    CoordinatorReadBearer:
      type: http
      scheme: bearer
      description: |
        Token из `POST .../coordinator/acquire` (active region) или `POST .../global/coordinator/acquire`.
        Тот же секрет, что для соответствующего `.../renew`. Альтернатива без Bearer — заголовок `X-Coordinator-Token`.
        Для **SSE** путей `.../stream/workers`, `.../stream/jobs`, `.../stream/keys`, `.../global/stream/workers`, `.../global/stream/jobs`
        допускается вместо токена лидера статический `coordination.sre.stream-listen-token` (тот же Bearer или
        `X-Coordinator-Token`) — только эти пять операций; для **`.../stream/keys`** дополнительно допустим **только**
        global coordinator read token или SRE-токен (не regional leader). Остальные GET по-прежнему только с токеном лидера.
    JobHolderWorkerRead:
      type: http
      scheme: bearer
      description: |
        Только для **GET одного job** (`.../jobs/{jobId}` или `.../global/jobs/{jobId}`): токен из
        `POST .../workers/register` (тот же контур), если этот worker — **holder** lock'а. То же значение можно
        передать в `X-Worker-Token` (как для GET `.../workers/{workerId}/jobs`).

  parameters:
    tenantId:
      name: tenantId
      in: path
      required: true
      schema:
        type: string
    workerId:
      name: workerId
      in: path
      required: true
      schema:
        type: string
    jobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
    idempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        maxLength: 128
      description: |
        Опциональный ключ идемпотентности (алиас `X-Idempotency-Key`). Учитывается только если на сервере включено
        `coordination.idempotency.enabled` и путь в allowlist. Ответ **200** / **201** / **409** кешируется до TTL.

  schemas:
    StringMap:
      type: object
      additionalProperties:
        type: string

    CoordinatorAcquireRequest:
      type: object
      required: [coordinatorId, instanceId, ttlSeconds]
      properties:
        coordinatorId:
          type: string
          description: Стабильный логический id роли координатора (аналог workerId)
        instanceId:
          type: string
          description: Id процесса-владельца lease; должен совпадать с renew
        ttlSeconds:
          type: integer
          minimum: 10
          maximum: 300
          description: Lease TTL для etcd (секунды); 10–300 включительно
        metadata:
          $ref: "#/components/schemas/StringMap"

    ResourceConflict:
      type: object
      description: Конфликт при создании ресурса (лидер / job / worker уже есть)
      properties:
        error:
          type: string
          description: COORDINATOR_EXISTS | JOB_EXISTS | WORKER_EXISTS
        message:
          type: string
        currentHolder:
          description: Для COORDINATOR_EXISTS / JOB_EXISTS — текущий владелец
          oneOf:
            - $ref: "#/components/schemas/CoordinatorRecord"
            - $ref: "#/components/schemas/JobRecord"
        alreadyRegistered:
          description: Для WORKER_EXISTS — текущая регистрация
          $ref: "#/components/schemas/WorkerRecord"

    CoordinatorRenewRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: Секрет, возвращённый в ответе acquire (как token у воркера)

    CoordinatorRecord:
      type: object
      required: [coordinatorId, instanceId, issuedAt, fenceEpoch]
      properties:
        coordinatorId:
          type: string
        instanceId:
          type: string
        token:
          type: string
          description: Выдаётся при успешном acquire; нужен для renew
        metadata:
          $ref: "#/components/schemas/StringMap"
        issuedAt:
          type: string
          format: date-time
        fenceEpoch:
          type: integer
          format: int64
          description: Монотонный fencing token для записи в хранилища

    CoordinatorState:
      type: object
      description: CoordinatorRecord + lease/modRevision из etcd
      properties:
        record:
          $ref: "#/components/schemas/CoordinatorRecord"
        leaseId:
          type: integer
          format: int64
        modRevision:
          type: integer
          format: int64

    AcquireCoordinatorResult:
      type: object
      properties:
        acquired:
          type: boolean
        leaseId:
          type: integer
          format: int64
        revision:
          type: integer
          format: int64
        fenceEpoch:
          type: integer
          format: int64
          description: При acquired=true — новый epoch; при false может отражать текущего лидера
        token:
          type: string
          description: При acquired=true — секрет для renew (дублирует record.token после GET)
        currentHolder:
          $ref: "#/components/schemas/CoordinatorRecord"

    WorkerRegisterRequest:
      type: object
      required: [workerId, instanceId, ttlSeconds]
      properties:
        workerId:
          type: string
        instanceId:
          type: string
        ttlSeconds:
          type: integer
          minimum: 10
          maximum: 300
          description: Lease TTL для etcd (секунды); 10–300 включительно
        metadata:
          $ref: "#/components/schemas/StringMap"

    WorkerHeartbeatRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string

    WorkerRecord:
      type: object
      properties:
        workerId:
          type: string
        instanceId:
          type: string
        token:
          type: string
        metadata:
          $ref: "#/components/schemas/StringMap"
        issuedAt:
          type: string
          format: date-time

    WorkerState:
      type: object
      properties:
        record:
          $ref: "#/components/schemas/WorkerRecord"
        leaseId:
          type: integer
          format: int64
        modRevision:
          type: integer
          format: int64

    WorkerRegisterResult:
      type: object
      properties:
        created:
          type: boolean
        token:
          type: string
        leaseId:
          type: integer
          format: int64
        alreadyRegistered:
          $ref: "#/components/schemas/WorkerRecord"

    JobAcquireRequest:
      type: object
      required: [holder, ttlSeconds, participantToken]
      properties:
        holder:
          type: string
          description: |
            Идентификатор участника, который берёт лок: **coordinatorId** активного регионального (или глобального)
            лидера, либо **workerId**, зарегистрированного в том же контуре (active region для regional jobs;
            глобальный пул для `.../global/jobs/...`). Должен совпадать с `participantToken` (токен acquire лидера
            или токен register воркера).
        ttlSeconds:
          type: integer
          minimum: 10
          maximum: 300
          description: Lease TTL для etcd (секунды); 10–300 включительно
        metadata:
          $ref: "#/components/schemas/StringMap"
        participantToken:
          type: string
          description: |
            Доказательство участника: `token` из `coordinator/acquire` (если `holder` = coordinatorId) или из
            `workers/register` / `global/workers/register` (если `holder` = workerId). Без него знание только id
            недостаточно для захвата лока.

    JobTokenRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: Секрет из ответа `...:acquire` при acquired=true (как у coordinator/worker).

    JobRecord:
      type: object
      properties:
        jobId:
          type: string
        holder:
          type: string
        token:
          type: string
          description: Секрет владения; в старых ключах может отсутствовать (только holder).
        metadata:
          $ref: "#/components/schemas/StringMap"
        issuedAt:
          type: string
          format: date-time

    JobState:
      type: object
      properties:
        record:
          $ref: "#/components/schemas/JobRecord"
        leaseId:
          type: integer
          format: int64
        modRevision:
          type: integer
          format: int64

    KvPutRequest:
      type: object
      required: [value]
      properties:
        value:
          description: Произвольный JSON (объект, массив, примитив)
        ttlSeconds:
          type: integer
          nullable: true
          minimum: 10
          maximum: 300
          description: Если задано — etcd lease; иначе ключ без TTL (пока не удалён)

    KvPutResponse:
      type: object
      properties:
        created:
          type: boolean
        keyId:
          type: string
        accessToken:
          type: string
          nullable: true
          description: Только при created=true; для GET/DELETE
        leaseId:
          type: integer
          format: int64
        modRevision:
          type: integer
          format: int64

    KvGetResponse:
      type: object
      properties:
        value:
          description: Пользовательское значение
        leaseId:
          type: integer
          format: int64
        modRevision:
          type: integer
          format: int64

    AcquireJobResult:
      type: object
      properties:
        acquired:
          type: boolean
        leaseId:
          type: integer
          format: int64
        revision:
          type: integer
          format: int64
        token:
          type: string
          description: При acquired=true — сохраните для renew/release (как coordinator token).
        currentHolder:
          $ref: "#/components/schemas/JobRecord"

    ComputeRangesRequest:
      type: object
      required: [workerIds]
      properties:
        workerIds:
          type: array
          items:
            type: string
          description: Список workerId (длина списка — число участников кольца); порядок влияет только на tie-break при коллизии позиций.
        virtualNodes:
          type: integer
          minimum: 1
          description: Число виртуальных узлов на worker (Ketama); если не передано или ≤0 — на сервере 128.
        withPos:
          type: boolean
          default: false
          description: |
            Если true — в ответе будет массив `points` (все vnode с полем `pos` на кольце). По умолчанию только `ranges`
            (меньше трафика). В JSON также принимается алиас `withpos`.

    RingAssignResponse:
      type: object
      required: [ranges]
      properties:
        ranges:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: "#/components/schemas/RingRangeHalfOpen"
          description: workerId → список полуинтервалов [start,end) на uint32-кольце (в JSON как числа).
        points:
          type: array
          description: Присутствует только при withPos=true в запросе
          items:
            type: object
            required: [pos, workerId]
            properties:
              pos:
                type: integer
                format: int64
                description: Позиция vnode на кольце (0..2^32-1)
              workerId:
                type: string

    RingRangeHalfOpen:
      type: object
      required: [start, end]
      properties:
        start:
          type: integer
          format: int64
        end:
          type: integer
          format: int64

    ActiveRegionInfo:
      type: object
      properties:
        tenantId:
          type: string
        region:
          type: string
          description: Текущий logical active region (тот же id, что подставляется в ключи etcd для short-path API).
        status:
          type: string
          enum: [active, stand_in, switch]
          description: |
            Роль этого инстанса: основной ЦОД (`active`), stand-in (`stand_in`), или переход (`switch`).
            Меняется при поллинге `coordination.deployment.role-file` → env `coordination.deployment.role-env-var`
            (по умолчанию `COORDINATION_DEPLOYMENT_ROLE`) → `coordination.deployment.role` в конфиге; интервал —
            `coordination.active-region.poll-interval-ms`. В режиме `switch` regional мутации отклоняются (**403**), global
            разрешён; при активном `REGION_DRAIN` сервер может удалять старые lease-ключи coordinator/workers/jobs (см. README).
        activeRegion:
          type: string
          description: То же, что `region` (оставлено для обратной совместимости).
        source:
          type: string
          description: Например env:COORDINATION_ACTIVE_REGION, file, config, fallback
        regionalWritesBlocked:
          type: boolean
          description: |
            true пока после смены active region не освободился сегмент предыдущего региона: по умолчанию ждём TTL
            lease-ключей coordinator/workers/jobs (кроме coordinationEpoch). При роли деплоя `SWITCH` те же ключи
            удаляются из etcd принудительно на каждом poll drain (ускорение; безопасно только если владельцы остановлены).
            Пока true — acquire/register/job в active-region отклоняются (409).
        drainingPreviousRegion:
          type: string
          nullable: true
          description: Id предыдущего активного региона, ключи которого ждём до TTL; null если drain не активен
